spring:
  application:
    name: "hahl2025"
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/hahl_database
    username: hahl_user
    password: hahl_password
    locations: classpath:/db/migration
  #  application:
  #    name: hahl
  datasource:
    url: jdbc:postgresql://localhost:5432/hahl_database
    username: hahl_user
    password: hahl_password
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: 127.0.0.1:9092

    consumer:
      group-id: hahl2025-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      type: single
      auto-startup: false
      missing-topics-fatal: false

    producer:
      properties:
        # Обновлять метаданные каждые 10 секунд (по умолчанию 5 минут)
        metadata.max.age.ms: 10000
        # Отключить кэширование для отладки
        max.block.ms: 5000

app:
  kafka:
    topic: hahl-topic

#  data:
#    redis:
#      host: localhost
#      port: 6379
#      password: hahl_redis_password
#      user: hahl_user


management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        timing.measures: true
      sla:
        http.server.requests: 1ms,5ms,10ms,50ms,100ms
        timing.measures: 1ms,5ms,10ms,50ms,100ms
  endpoints:
    web:
      exposure:
        include: "*"