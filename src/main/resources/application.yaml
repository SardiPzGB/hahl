spring:
  application:
    name: "hahl2025"
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/hahldatabase
    user: hahluser
    password: hahlpassword
    locations: classpath:/db/migration
  #  application:
  #    name: hahl
  datasource:
    url: jdbc:postgresql://localhost:5432/hahldatabase
#    driver-class-name: org.postgresql.Driver
    hikari:
      username: hahluser
      password: hahlpassword
      maximum-pool-size: 10
      jdbc-url: jdbc:postgresql://localhost:5432/hahldatabase
      connection-timeout: 30000 # 30 секунд
      max-lifetime: 1800000


  kafka:
    bootstrap-servers: 127.0.0.1:9092

    consumer:
      group-id: hahl2025-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      type: single
      auto-startup: false
      missing-topics-fatal: false

    producer:
      properties:
        # Обновлять метаданные каждые 10 секунд (по умолчанию 5 минут)
        metadata.max.age.ms: 10000
        # Отключить кэширование для отладки
        max.block.ms: 5000

app:
  kafka:
    topic: hahl-topic
  debezium:
    table: public.storedata
management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        timing.measures: true
      sla:
        http.server.requests: 1ms,5ms,10ms,50ms,100ms
        timing.measures: 1ms,5ms,10ms,50ms,100ms
  endpoints:
    web:
      exposure:
        include: "*"