spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: hahl_redis_password
      user: hahl_user
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:6432/hahldatabase
    user: hahluser
    password: hahlpassword
    locations: classpath:/db/migration
  application:
    name: hahl
  datasource:
    primary:
      jdbcUrl: jdbc:postgresql://localhost:6432/hahldatabase
      username: hahluser
      password: hahlpassword
      driver-class-name: org.postgresql.Driver
    replica:
      jdbcUrl: jdbc:postgresql://localhost:6433/hahldatabase
      username: hahluser
      password: hahlpassword
      driver-class-name: org.postgresql.Driver

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        timing.measures: true
      sla:
        http.server.requests: 1ms,5ms,10ms,50ms,100ms
        timing.measures: 1ms,5ms,10ms,50ms,100ms
  endpoints:
    web:
      exposure:
        include: "*"